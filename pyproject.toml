[build-system]
requires = ["setuptools>=77"]  # 77+ for the SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "netconfig-auditor"
version = "0.1.0"
description = "Offline security and operational audit of Cisco IOS / IOS XE configuration files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muidh Salem Al Hamamah" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["cisco", "ios", "network", "configuration", "audit", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ncaudit = "ncaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
